name: ci
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
# one run per ref: a newer push cancels the older run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # sock-contract is private until it is published (ADR 1); drop this,
      # the agent and the rewrite once it is public
      GOPRIVATE: github.com/guygrigsby/*
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CONTRACT_DEPLOY_KEY }}
      - run: git config --global url."git@github.com:".insteadOf "https://github.com/"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - run: make check
